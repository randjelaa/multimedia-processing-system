<h2>Upload File</h2>

<input
  type="file"
  (change)="onFileSelected($event)"
/>

<br><br>

<select [(ngModel)]="jobType">

  <option value="THUMBNAIL">
    Thumbnail Extraction
  </option>

  <option value="AUDIO">
    Audio Extraction
  </option>

</select>

<br><br>

<button (click)="upload()">
  Upload
</button>

<br><br>

<button routerLink="/dashboard">
  Back to Dashboard
</button>
