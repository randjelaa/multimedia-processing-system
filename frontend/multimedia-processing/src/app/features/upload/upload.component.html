<h2>Upload File</h2>

<input
  type="file"
  (change)="onFileSelected($event)"
/>

<br /><br />

<select [(ngModel)]="jobType">
  <option value="THUMBNAIL">
    Thumbnail extraction
  </option>

  <option value="AUDIO">
    Audio extraction
  </option>

  <option value="TRANSCODE">
    Transcode video
  </option>
</select>

<br /><br />

<button (click)="upload()">
  Upload
</button>

<br /><br />

<button routerLink="/dashboard">
  Back to Dashboard
</button>

<hr />

<div *ngIf="currentJob">

  <h3>
    {{ currentJob.originalFileName }}
  </h3>

  <p>
    Status:
    <strong>
      {{ currentJob.status }}
    </strong>
  </p>

  <p>
    Progress:
    {{
      currentJob.progressPercentage
    }}%
  </p>

  <div class="progress-container">

    <div
      class="progress-bar"
      [style.width]="
        getProgressWidth()
      "
    ></div>

  </div>

  <div
    *ngIf="
      currentJob.status === 'DONE'
    "
  >
    <h4>
      Processing completed!
    </h4>
  </div>

  <div
    *ngIf="
      currentJob.status === 'FAILED'
    "
  >
    <h4>
      Processing failed!
    </h4>
  </div>
</div>
