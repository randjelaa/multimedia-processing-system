spring.application.name=multimedia-processing

spring.datasource.url=jdbc:mysql://localhost:3307/multimedia_processing
spring.datasource.username=multimedia_user
spring.datasource.password=multimedia_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

minio.url=http://localhost:9000
minio.access-key=admin
minio.secret-key=password
minio.bucket=uploads

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB