spring.application.name=multimedia-processing

#database
spring.datasource.url=jdbc:mysql://localhost:3307/multimedia_processing
spring.datasource.username=multimedia_user
spring.datasource.password=multimedia_pass

#jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#minio
minio.url=http://localhost:9000
minio.access-key=admin
minio.secret-key=password
minio.bucket=uploads

#rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.thumbnail=thumbnail.queue
rabbitmq.queue.audio=audio.queue
rabbitmq.queue.transcode=transcode.queue
rabbitmq.queue.results=jobs.results.queue

rabbitmq.exchange.control=jobs.control.exchange

#max size of multipart files
spring.servlet.multipart.max-file-size=10000MB
spring.servlet.multipart.max-request-size=10000MB

#cors
app.cors.allowed-origins=http://localhost:4200

#public endpoints
app.security.public-endpoints=/api/auth/**

#jwt
jwt.secret=mysecretkeymysecretkeymysecretkey123456
jwt.expiration-ms=86400000