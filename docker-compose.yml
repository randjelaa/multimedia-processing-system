version: '3.9'

services:

  mysql:
    image: mysql:8
    container_name: multimedia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: student
      MYSQL_DATABASE: multimedia_processing
      MYSQL_USER: multimedia_user
      MYSQL_PASSWORD: multimedia_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: multimedia-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    container_name: multimedia-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data: